jwt.secret =TH0ZkLRGQdnm8jDILcKj4k07UVryJZ9y8vXIzAy3vjB

# 15 minutes = 15 * 60 * 1000 = 900000 ms
jwt.expiration=900000

# 7 days = 7 * 24 * 60 * 60 * 1000 = 604800000 ms
