spring.application.name=Egzersiz

# PostgreSQL connection settings
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=fitnessai}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=fitnessai
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Initialize schema before Hibernate runs
spring.sql.init.mode=always

# Fail fast if the database is unreachable
spring.datasource.hikari.initializationFailTimeout=60000
spring.sql.init.continue-on-error=false

